    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Archilya",
      "url": "https://archilya.com",
      "logo": "https://archilya.com/favicon.png",

      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Çorlu, Tekirdağ, Türkiye"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+90-282-606-06-39",
        "contactType": "sales",
        "availableLanguage": ["Türkçe", "English"]
      }
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Archilya",
      "operatingSystem": "Web",
      "applicationCategory": "DesignApplication",
      "description": "AI Studio ile premium render, revizyon, plan boyama ve analiz. Pixel Streaming, VR ve 360 sunum katmanıyla müşteri deneyimi.",
      "offers": {
        "@type": "AggregateOffer",
        "offerCount": "4",
        "availability": "https://schema.org/OnlineOnly"
      }
    }
    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Archilya hangi dosya formatlarını destekliyor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Revit, SketchUp, Rhino, AutoCAD ve yaygın CAD/BIM formatlarıyla uyumludur. Ayrıca görsel ve PDF proje dosyalarını da kabul eder."
          }
        },
        {
          "@type": "Question",
          "name": "VR sunum için özel donanım gerekli mi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hayır. Pixel Streaming teknolojimiz sayesinde sunumlar web tarayıcısından izlenebilir. VR başlık ile deneyim opsiyoneldir."
          }
        },
        {
          "@type": "Question",
          "name": "AI Studio hangi araçları sunuyor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Premium Render, Revizyon Düzenleyici, Premium Kat Planı, Tasarım Analizi, Çok Açılı Render, Doku Üretici, 360 Panorama ve 4K İyileştirme araçlarını içerir."
          }
        },
        {
          "@type": "Question",
          "name": "Abonelik planları nelerdir?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keşif (ücretsiz), Solo, Pro ve Studio olmak üzere dört abonelik katmanı sunuyoruz. Her katman farklı işlem kredisi, depolama ve ekip kapasitesi içerir."
          }
        }
      ]
    }
    </script>
